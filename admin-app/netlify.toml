# New, separate Vanessa admin Netlify project. Set the project base directory
# to admin-app so these settings cannot change the customer-facing site.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions."health-scheduled"]
  schedule = "17 8 * * *"

# Lightweight public-site/admin/Identity/token checks; full audit remains daily.
[functions."health-essential-scheduled"]
  schedule = "47 * * * *"
